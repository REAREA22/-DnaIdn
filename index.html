<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANA Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <img src="assets/logo.png" class="logo">
</header>

<section class="banner">
  <img src="assets/banner.jpg" class="banner-img">
</section>

<section class="card">
  <h3>Silahkan Pilih Sesuai Dengan Kebutuhan Anda di Bawah Ini</h3>

  <div class="option active" onclick="selectOption(this)">
    <div class="radio"></div>
    AKTIFKAN DANA PAYLATER
  </div>

  <div class="option" onclick="selectOption(this)">
    <div class="radio"></div>
    AKTIFKAN DANA CICIL
  </div>

  <div class="option" onclick="selectOption(this)">
    <div class="radio"></div>
    LAPORKAN KENDALA AKUN
  </div>
</section>

<div class="btn">Konfirmasi</div>

<footer class="footer">
  <img src="assets/footer-logo.png">
</footer>

<script src="script.js"></script>
</body>
</html>
